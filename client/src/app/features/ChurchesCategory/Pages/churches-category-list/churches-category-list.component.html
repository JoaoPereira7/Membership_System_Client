<app-list-page-shell
  title="Categorias de igreja"
  subtitle="Gerencie as categorias utilizadas na classificação das igrejas."
  icon="category"
  [breadcrumbs]="breadcrumbs"
  contentPadding="compact"
>
  <button
    class="auxiliary-list__new-button"
    page-primary-action
    mat-flat-button
    color="primary"
    type="button"
    (click)="openCreateDialog()"
  >
    <mat-icon>add</mat-icon><span>Nova categoria</span>
  </button>

  <app-data-table-toolbar
    list-toolbar
    searchPlaceholder="Pesquisar categoria"
    [searchValue]="search()"
    [filterEnabled]="false"
    [exportEnabled]="false"
    [refreshEnabled]="true"
    [loading]="loading()"
    [totalItems]="totalItems()"
    (searchChanged)="onSearchChanged($event)"
    (refreshRequested)="reload()"
  />

  <app-data-table
    list-content
    mode="server"
    ariaLabel="Lista de categorias de igreja"
    emptyMessage="Nenhuma categoria de igreja encontrada."
    [data]="data()"
    [columns]="columns"
    [actions]="actions"
    [detailsComponent]="detailsDialogComponent"
    [deleteComponent]="deleteDialogComponent"
    [loading]="loading()"
    [errorMessage]="errorMessage()"
    [toolbarEnabled]="false"
    [totalItems]="totalItems()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    (queryChanged)="onQueryChanged($event)"
    (actionTriggered)="onAction($event)"
  />
</app-list-page-shell>
