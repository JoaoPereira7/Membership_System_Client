<app-list-page-shell
  title="Situações da membresia"
  subtitle="Gerencie as situações utilizadas no acompanhamento da membresia."
  icon="fact_check"
  [breadcrumbs]="breadcrumbs"
  contentPadding="compact"
>
  <button
    class="auxiliary-list__new-button"
    page-primary-action
    mat-flat-button
    color="primary"
    type="button"
    (click)="openCreateDialog()"
  >
    <mat-icon>add</mat-icon>
    <span>Nova situação</span>
  </button>

  <app-data-table-toolbar
    list-toolbar
    searchPlaceholder="Pesquisar situação da membresia"
    [searchValue]="search()"
    [filterEnabled]="false"
    [exportEnabled]="false"
    [refreshEnabled]="true"
    [loading]="loading()"
    [totalItems]="totalItems()"
    (searchChanged)="onSearchChanged($event)"
    (refreshRequested)="reload()"
  />

  <app-data-table
    list-content
    mode="server"
    ariaLabel="Lista de situações da membresia"
    emptyMessage="Nenhuma situação da membresia encontrada."
    [data]="data()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [errorMessage]="errorMessage()"
    [toolbarEnabled]="false"
    [totalItems]="totalItems()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    (queryChanged)="onQueryChanged($event)"
    (actionTriggered)="onAction($event)"
  />
</app-list-page-shell>
