<div class="admin-shell">
  <div
    class="admin-shell__backdrop"
    [class.admin-shell__backdrop--visible]="isMobile() && mobileSidebarOpen()"
    (click)="closeMobileSidebar()"
  ></div>

  <aside
    class="admin-shell__sidebar"
    [class.admin-shell__sidebar--collapsed]="sidebarCollapsed()"
    [class.admin-shell__sidebar--mobile]="isMobile()"
    [class.admin-shell__sidebar--mobile-open]="isMobile() && mobileSidebarOpen()"
    [style.width.px]="isMobile() ? 260 : sidebarCollapsed() ? 72 : 232"
  >
    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      [mobile]="isMobile()"
      (requestClose)="closeMobileSidebar()"
      (toggleSidebar)="toggleSidebar()"
    />
  </aside>

  <section class="admin-shell__main">
    <header class="admin-shell__header">
      <div class="admin-shell__titles">
        <h1 class="admin-shell__title">{{ pageTitle() }}</h1>
        <nav class="admin-shell__breadcrumb" aria-label="Breadcrumb">
          @for (item of breadcrumb(); track item; let last = $last) {
            <span>{{ item }}</span>
            @if (!last) {
              <mat-icon>chevron_right</mat-icon>
            }
          }
        </nav>
      </div>
    </header>

    <main class="admin-shell__content">
      <router-outlet />
    </main>

    <app-footer class="admin-shell__footer" />
  </section>
</div>
