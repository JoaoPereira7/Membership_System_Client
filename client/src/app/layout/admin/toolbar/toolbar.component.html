<header class="toolbar">
  <div class="toolbar__left">
    <div class="toolbar__titles">
      <h1 class="toolbar__title">{{ pageTitle() }}</h1>
      <nav class="toolbar__breadcrumb" aria-label="Breadcrumb">
        @for (item of breadcrumb(); track item; let last = $last) {
          <span class="toolbar__breadcrumb-item" [class.toolbar__breadcrumb-item--current]="last">{{ item }}</span>
          @if (!last) {
            <mat-icon>chevron_right</mat-icon>
          }
        }
      </nav>
    </div>
  </div>

  <div class="toolbar__center">
    <mat-form-field appearance="outline" class="toolbar__search">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput type="text" placeholder="Pesquisar" disabled />
    </mat-form-field>
  </div>

  <div class="toolbar__actions">
    <button mat-icon-button type="button" matTooltip="Notificações" aria-label="Notificações">
      <mat-icon [matBadge]="3" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
    </button>

    <button mat-icon-button type="button" matTooltip="Ajuda" aria-label="Ajuda">
      <mat-icon>help_outline</mat-icon>
    </button>

    <button mat-button [matMenuTriggerFor]="userMenu" type="button" class="toolbar__profile" aria-label="Menu do usuário">
      <span class="toolbar__avatar">JP</span>
      <span class="toolbar__profile-text">{{ userName() }}</span>
      <mat-icon>expand_more</mat-icon>
    </button>
  </div>
</header>

<mat-menu #userMenu="matMenu">
  <button mat-menu-item type="button">
    <mat-icon>person</mat-icon>
    <span>Perfil</span>
  </button>
  <button mat-menu-item type="button">
    <mat-icon>settings</mat-icon>
    <span>Configurações</span>
  </button>
  <button mat-menu-item type="button">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
