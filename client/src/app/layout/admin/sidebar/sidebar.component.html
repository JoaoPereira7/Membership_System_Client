<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <header class="sidebar__header">
    <div class="sidebar__logo" aria-hidden="true">
      <mat-icon>layers</mat-icon>
    </div>

    @if (!collapsed()) {
      <div class="sidebar__brand-copy">
        <strong>Igreja do Evangelho Quadrangular</strong>
      </div>
    }
  </header>

  <nav class="sidebar__nav" aria-label="Navegação principal">
    @for (item of items; track item.id) {
      <button
        type="button"
        class="sidebar-item"
        [class.sidebar-item--active]="item.active"
        [matTooltip]="collapsed() ? item.label : ''"
        matTooltipPosition="right"
        (click)="notifyInteraction()"
        matRipple
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        @if (!collapsed()) {
          <span class="sidebar-item__content">
            <span class="sidebar-item__label">{{ item.label }}</span>
            @if (item.futureSubmenu) {
              <mat-icon class="sidebar-item__chevron">expand_more</mat-icon>
            }
          </span>
        }
      </button>
    }
  </nav>

  <footer class="sidebar__footer">
    <button
      mat-icon-button
      type="button"
      class="sidebar__toggle"
      (click)="handleToggleClick()"
      [attr.aria-label]="mobile() ? 'Fechar sidebar' : collapsed() ? 'Expandir sidebar' : 'Recolher sidebar'"
    >
      <mat-icon>{{ mobile() ? 'close' : collapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </footer>
</aside>
